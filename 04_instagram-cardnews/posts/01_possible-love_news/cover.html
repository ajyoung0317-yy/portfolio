<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>onspace.film_ cover</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ===== 여기만 바꾸면 됩니다 ===== */
  :root {
    --point: #E5322D;          /* 포인트 컬러 (프로필 빨간 안경) */
  }
  /* ================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: #000; }
  body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; color: #fff; }

  .card {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    /* 스틸컷이 없을 때 보이는 임시 배경 */
    background:
      radial-gradient(ellipse at 60% 30%, #5a4a6e 0%, #2a2238 45%, #0d0b12 100%);
  }
  .card .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
  }
  .card .photo[src=""] { display: none; }

  /* 하단 그라데이션 (약 50%) */
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 30%, rgba(0,0,0,.88) 62%, rgba(0,0,0,.96) 100%);
  }

  .logo {
    position: absolute; top: 56px; left: 64px; z-index: 2;
    font-size: 34px; font-weight: 800; letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .logo i { font-style: normal; color: var(--point); }

  .text {
    position: absolute; left: 64px; right: 64px; bottom: 120px; z-index: 2;
  }
  .dots { display: flex; gap: 14px; margin-bottom: 26px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--point); }

  .title-light {
    font-size: 54px; font-weight: 400; line-height: 1.3; letter-spacing: -1.5px;
  }
  .title-bold {
    font-size: 66px; font-weight: 800; line-height: 1.25; letter-spacing: -2px;
    margin-top: 4px;
  }
  .sub {
    margin-top: 40px; font-size: 30px; font-weight: 400; line-height: 1.55;
    letter-spacing: -0.5px; color: rgba(255,255,255,.68);
  }

  .credit {
    position: absolute; right: 48px; bottom: 40px; z-index: 2;
    font-size: 18px; color: rgba(255,255,255,.45);
  }

  /* 가로 사진용: 두 인물이 다 보이도록 위쪽에 넓게 배치 */
  .card.wide { background: #000; }
  .card.wide .photo { inset: auto; top: 150px; left: 0; height: 650px; width: 100%; object-position: 50% 50%; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 7%, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0%, #000 7%, #000 78%, transparent 100%); }
  .card.wide::after {
    height: 50%;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.5) 20%, rgba(0,0,0,.95) 40%, #000 100%);
  }
</style>
</head>
<body>
  <div class="card">
    <!-- 스틸컷: src에 이미지 파일 경로 (예: ../images/movie1.jpg) -->
    <img class="photo" src="images/cover.jpg" alt="" style="object-position: 44.7% 0%">

    <div class="logo">onspace<i>.</i>film_</div>

    <div class="text">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title-light">이번 주 금요일, 넷플릭스에 오는</div>
      <div class="title-bold">이창동 감독 8년 만의 신작</div>
      <div class="sub">베니스 심사위원대상 수상작 &lt;가능한 사랑&gt;<br>전도연·설경구·조인성·조여정, 11월 6일 공개</div>
    </div>

    <div class="credit">© Netflix</div>
  </div>
</body>
</html>
