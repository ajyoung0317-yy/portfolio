<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ===== 공통 토큰 (모든 템플릿 동일) ===== */
  :root {
    --page: #f4f6f5; --paper: #ffffff; --bar: #dff5ec;
    --ink: #1f2328; --muted: #6b7280; --line: #e6e8eb;
    --accent: #0b8a5f; --accent-2: #0a7d8c; --accent-soft: #eef8f3;
    --mono: "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
  .canvas { width: 860px; padding: 36px; background: var(--page); }
  .window { background: var(--paper); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.08); overflow: hidden; }
  .bar { height: 34px; background: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff6159; } .bar i:nth-child(2) { background: #ffbd2e; } .bar i:nth-child(3) { background: #28c941; }
  .bar span { margin-left: 10px; font: 13px var(--mono); color: var(--muted); }
  .body { padding: 32px 36px 36px; }
  .label { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.3; }

  /* ===== 비교 표 ===== */
  table { width: 100%; margin-top: 24px; border-collapse: collapse; font-size: 19px; table-layout: fixed; }
  th, td { padding: 15px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; line-height: 1.4; word-break: keep-all; }
  thead th { font-size: 17px; font-weight: 700; color: var(--muted); background: #fafbfa; }
  thead th.col { color: var(--paper); background: var(--accent); text-align: center; }
  thead th.col.b { background: var(--accent-2); }
  tbody th { width: 22%; font-weight: 700; color: var(--muted); }
  tbody td { text-align: center; font-weight: 600; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
</style>
</head>
<body>
<div class="canvas">
  <div class="window">
    <div class="bar"><i></i><i></i><i></i><span>cast.md</span></div>
    <div class="body">
      <div class="label">// 주연 세 사람</div>
      <h1>영업부 주요 배역</h1>
      <table>
        <thead>
          <tr><th></th><th class="col">공은태</th><th class="col b">양준호</th><th class="col">정선혁</th></tr>
        </thead>
        <tbody>
          <tr><th>배우</th><td>이준혁</td><td>서현우</td><td>오대환</td></tr>
          <tr><th>소속</th><td>영업 5팀</td><td>영업 5팀</td><td>영업 4팀</td></tr>
          <tr><th>직급</th><td>팀장</td><td>대리</td><td>팀장</td></tr>
          <tr><th>특징</th><td>빨리 승진한 막내</td><td>공은태보다 선배</td><td>변화에 흔들림</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
