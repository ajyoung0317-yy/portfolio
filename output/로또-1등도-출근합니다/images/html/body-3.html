<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ===== 공통 토큰 (모든 템플릿 동일) ===== */
  :root {
    --page: #f4f6f5; --paper: #ffffff; --bar: #dff5ec;
    --ink: #1f2328; --muted: #6b7280; --line: #e6e8eb;
    --accent: #0b8a5f; --accent-2: #0a7d8c; --accent-soft: #eef8f3;
    --mono: "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
  .canvas { width: 860px; padding: 36px; background: var(--page); }
  .window { background: var(--paper); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.08); overflow: hidden; }
  .bar { height: 34px; background: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff6159; } .bar i:nth-child(2) { background: #ffbd2e; } .bar i:nth-child(3) { background: #28c941; }
  .bar span { margin-left: 10px; font: 13px var(--mono); color: var(--muted); }
  .body { padding: 32px 36px 36px; }
  .label { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.3; }

  /* ===== 단계별 다이어그램: 3~5단계, 가로로 배치 ===== */
  .steps { display: flex; align-items: stretch; margin-top: 26px; }
  .step { flex: 1; min-width: 0; background: var(--accent-soft); border-radius: 12px; padding: 20px 14px 18px; text-align: center; }
  .num { font: 700 14px var(--mono); color: var(--accent); }
  .when { margin-top: 6px; font-size: 22px; font-weight: 800; line-height: 1.3; word-break: keep-all; }
  .what { margin-top: 6px; font-size: 16px; color: var(--muted); line-height: 1.4; word-break: keep-all; }
  .step.now { background: var(--accent); }
  .step.now .num, .step.now .when, .step.now .what { color: #fff; }
  .arrow { flex: 0 0 28px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
<div class="canvas">
  <div class="window">
    <div class="bar"><i></i><i></i><i></i><span>rating.md</span></div>
    <div class="body">
      <div class="label">// tvN 시청률 흐름</div>
      <h1>최종회 자체 최고 기록</h1>
      <div class="steps">
        <div class="step"><div class="num">01</div><div class="when">3.9%</div><div class="what">1회</div></div>
        <div class="arrow">→</div>
        <div class="step"><div class="num">02</div><div class="when">5.2%</div><div class="what">2회</div></div>
        <div class="arrow">→</div>
        <div class="step"><div class="num">03</div><div class="when">5.9%</div><div class="what">8회</div></div>
        <div class="arrow">→</div>
        <div class="step now"><div class="num">04</div><div class="when">6.2%</div><div class="what">최종 10회</div></div>
      </div>
      <p style="margin-top:16px;font-size:14px;color:var(--muted);">닐슨코리아 유료플랫폼 전국 가구 기준</p>
    </div>
  </div>
</div>
</body>
</html>
